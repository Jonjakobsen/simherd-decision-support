[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simherd-decision-support"
version = "0.1.0"
description = "Early Warning System til detektion af sygdom hos køer vha. GRU og økonomisk beslutningsstøtte."
authors = [
    { name = "Jon Skaarup Jakobsen", email = "jonskaarupjakobsen@gmail.com" }
]
dependencies = [
    "torch",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "streamlit>=1.22.0",
]



[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]